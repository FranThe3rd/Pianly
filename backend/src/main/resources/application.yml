spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/pianly
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret-key: ${JWT_SECRET_KEY:REDACTED}

stripe:
  secret-key: ${STRIPE_SECRET_KEY:sk_test_your_secret_key_here}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  price-amount: 800
  currency: usd
  product-name: "Pianly Pro"

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

